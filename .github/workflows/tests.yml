name: Testes FoodLink

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django-e-navegadores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium webkit
      - name: Verificar aplicação e migrações
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Testar backend
        run: python manage.py test
      - name: Testar fluxos e responsividade
        run: python manage.py test projetoapp.browser_tests
      - name: Guardar evidências de navegador
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-navegadores
          path: test-results/
          retention-days: 14
