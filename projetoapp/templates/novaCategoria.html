{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Nova categoria</title>
    <link rel="stylesheet" href="{% static 'css/novaCategoria.css' %}">
</head>

<body>
    <div class="logo">
        <img src="{% static 'css/JulianaBassan/novalogo.jpg' %}" alt="FoodLink" width="100">
    </div>

    <a href="{% url 'adicionarProduto' %}">Voltar ao cadastro de produto</a>

    <h1>Nova categoria</h1>
    <p>Crie uma categoria para organizar os produtos do cardápio.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.errors }}
        <label for="id_nome">Nome da categoria</label><br>
        {{ form.nome }}

        <p>
            <button type="submit">Salvar categoria</button>
        </p>
    </form>

    <p class="rodape">FoodLink</p>
</body>
</html>
