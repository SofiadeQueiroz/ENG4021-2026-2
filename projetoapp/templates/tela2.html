{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>FoodLink</title>
    <link rel="stylesheet" href="{% static 'css/tela2.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>

<body>

<div class="header"> 

    
    <p><span style="color:brown">SEU CARDAPIO</span></p>
    <h1> <b>Editar produto</b></h1>

        <form method="post">
        {% csrf_token %}
        {{ form.errors }}

        <h2>Nome do produto</h2>
        {{ form.nome }}

        <h2>Descricao</h2>
        {{ form.descricao }}

        <div class="precoCategoria">
            <div>
                <h2>Preco</h2>
                {{ form.preco }}
            </div>
            <div>
                <h2>Categorias</h2>
                <select name="categoria">
                    {% for c in categorias %}
                        <option {% if c == produto.categoria %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <h2>Foto do prato</h2>
        {{ form.imagem }}

        <div class="botoes">
            <a href="{% url 'cardapioDono' %}" class="cancelar">Cancelar</a>
            <button type="submit">Salvar produto</button>
        </div>
    </form>
</body>
</html>
