<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FoodLink</title>
    <link rel="stylesheet" href="tela2.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>

<body>

<div class="header"> 

    
    <p><span style="color:brown">SEU CARDAPIO</span></p>
    <h1> <b>Editar produto</b></h1>

    <p>Cada detalhe ajuda na hora de escolher</p>

    <h2>Nome do produto</h2>
    <input type="text" placeholder="Digite o nome do produto">


    <h2>Descricao</h2>
    <textarea placeholder="Digite a descricao do produto"></textarea>


    <div class="precoCategoria">

        <div>
            <h2>Preco</h2>
            <input type="text" placeholder="R$ 0,00">
        </div>

        <div>
            <h2>Categorias</h2>
            <input type="text" placeholder="Digite a categoria">
        </div>

    </div>

    <h2>Foto do prato</h2>
    <input type="text" placeholder="Cole o link da imagem">
    
    <div class="botoes">
        <button>Cancelar</button>
        <button>Salvar produto</button>
    </div>

</div>
</body>
</html>
