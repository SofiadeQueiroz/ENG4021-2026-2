{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>QR Code</title>
    <link href="{% static 'css/qrcode.css' %}" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="topo">
        <a href="{% url 'inicioCliente' %}" class="botao-secundario">Voltar</a>
        <img src="{% static 'css/JulianaBassan/novalogo.jpg' %}" alt="Logo do FoodLink" width="100">
    </div>

    <h4 class="chamada">CARDÁPIO DIGITAL</h4>
    <h2>Envie a imagem do QR Code</h2>
    <h5 class="descricao">Use um print ou uma foto do QR Code do restaurante</h5>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="centralizacao">
            <img src="https://play-lh.googleusercontent.com/BOGY3oCN4Bd-ogMXphOq2YjkwDdI8bQKtDVQ4ysQlZhXavDDsOqxKrGbTOiZ9TOnEjHVYRlwkq0gp-gJ1QtzIUY" alt="Moldura do leitor de QR Code">
        </div>

        <div class="centralizacao">
            <label for="imagem">Imagem do QR Code (até 1 MB)</label>
        </div>
        <div class="centralizacao">
            <input id="imagem" name="imagem" type="file" accept="image/*" required>
        </div>

        <div class="centralizacao">
            <button class="botao-principal" type="submit">Ler QR Code</button>
        </div>
    </form>

    {% if erro %}
    <p class="erro">{{ erro }}</p>
    {% endif %}

    <div class="centralizacao">
        <p>Food<span class="destaque">Link</span></p>
    </div>
</body>
</html>
