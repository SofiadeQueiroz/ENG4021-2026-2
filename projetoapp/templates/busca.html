{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Busca</title>
    <link href="{% static 'css/busca.css' %}" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
 
<body>
    <div class="topo">
        <a href="{% url 'inicioCliente' %}" class="botao-secundario">Voltar</a>
        <img src="{% static 'css/JulianaBassan/novalogo.jpg' %}" alt="Logo do FoodLink" width="80">
    </div>
 
    <h2>Onde vamos comer?</h2>
    <form method="get" class="linha-busca">
    <input type="search" name="q" placeholder="Busca" aria-label="Buscar" value="{{ q }}">
    <button type="submit" class="botao-secundario">Buscar</button>
    <a href="{% url 'favoritos' %}" class="botao-principal">Favoritos</a>
</form>

{% if q %}
    <div class="resultados">
        {% for r in restaurantes %}
            <p>
                <b>
                    <a href="{% url 'cardapioPublico' r.pk %}">{{ r.nome }}</a>
                </b>
                · {{ r.cozinha }} · {{ r.endereco }}
            </p>
        {% empty %}
            <p>Nenhum restaurante encontrado para "{{ q }}".</p>
        {% endfor %}
    </div>
{% endif %}
 
    <div class="centralizacao">
        <div id="mapa"></div>
    </div>
 
    <div class="centralizacao">
        <button class="botao-principal" id="botao-proximos" type="button">Três lugares próximos</button>
        <button class="botao-secundario" id="botao-tela-cheia" type="button">Tela cheia</button>
    </div>
        <div class="resultados" id="lista-proximos"></div>
    <div class="centralizacao">
        <p>Food<span class="destaque">Link</span></p>
    </div>
    <script>
    var mapa = L.map('mapa').setView([{{ lat }}, {{ lon }}], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(mapa);
    L.marker([{{ lat }}, {{ lon }}]).addTo(mapa)
        .bindPopup('{{ endereco|escapejs }}').openPopup();
        
    var camadaProximos = L.layerGroup().addTo(mapa);
    var botaoProximos = document.getElementById('botao-proximos');
    var listaProximos = document.getElementById('lista-proximos');

    botaoProximos.addEventListener('click', function () {
        listaProximos.textContent = 'Buscando...';
        camadaProximos.clearLayers();

        fetch('{% url "proximos" %}?lat={{ lat }}&lon={{ lon }}')
            .then(function (resposta) {
                if (!resposta.ok) { throw new Error('Erro ' + resposta.status); }
                return resposta.json();
            })
            .then(function (dados) {
                listaProximos.textContent = '';
                if (dados.restaurantes.length === 0) {
                    listaProximos.textContent = 'Nenhum restaurante com localização cadastrada.';
                    return;
                }
                var pontos = [[{{ lat }}, {{ lon }}]];
                dados.restaurantes.forEach(function (r) {
                    var p = document.createElement('p');
                    var nome = document.createElement('b');
                    nome.textContent = r.nome;
                    p.appendChild(nome);
                    p.appendChild(document.createTextNode(
                        ' · ' + r.cozinha + ' · ' + r.endereco + ' · ' + r.distancia_km.toFixed(2).replace('.', ',') + ' km'
                    ));
                    listaProximos.appendChild(p);

                    L.marker([r.latitude, r.longitude]).addTo(camadaProximos).bindPopup(r.nome);
                    pontos.push([r.latitude, r.longitude]);
                });
                mapa.fitBounds(pontos, { padding: [30, 30] });
            })
            .catch(function () {
                listaProximos.textContent = 'Não foi possível buscar os restaurantes. Tente novamente.';
            });
    });

    var botaoTelaCheia = document.getElementById('botao-tela-cheia');
    var elementoMapa = document.getElementById('mapa');

    function atualizarBotaoTelaCheia() {
        var ativo = document.fullscreenElement || elementoMapa.classList.contains('mapa-tela-cheia');
        botaoTelaCheia.textContent = ativo ? 'Sair da tela cheia' : 'Tela cheia';
        setTimeout(function () { mapa.invalidateSize(); }, 150);
    }

    botaoTelaCheia.addEventListener('click', function () {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        } else if (elementoMapa.requestFullscreen) {
            elementoMapa.requestFullscreen();
        } else {
            elementoMapa.classList.toggle('mapa-tela-cheia');
            atualizarBotaoTelaCheia();
        }
    });

    document.addEventListener('fullscreenchange', atualizarBotaoTelaCheia);
</script>
</body>
</html>
