{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ produto.nome }} - FoodLink</title>
    <link rel="stylesheet" href="{% static 'css/detalhesProduto.css' %}">
</head>

<body>
    <p class="logo">Food<span>Link</span></p>
    <a href="{% url 'cardapioPublico' %}#{{ produto.categoria|slugify }}">Voltar ao cardápio</a>

    {% if produto.imagem %}
        <img class="foto" src="{{ produto.imagem }}" alt="{{ produto.nome }}">
    {% endif %}

    <p class="categoria">Casa di Pasta · {{ produto.categoria }}</p>
    <h1>{{ produto.nome }}</h1>
    <p class="preco">{{ preco }}</p>

    <div class="descricao">
        <h2>Descrição</h2>
        <p>{{ produto.descricao }}</p>
    </div>

    <a class="botao" href="{% url 'cardapioPublico' %}">Ver outros pratos</a>

    <p class="rodape">FoodLink · Cardápio digital</p>
</body>
</html>
