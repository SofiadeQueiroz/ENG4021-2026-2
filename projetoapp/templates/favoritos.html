{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seus favoritos</title>
    <link href="{% static 'css/favoritos.css' %}" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="topo">
        <a href="{% url 'busca' %}" class="botao-secundario">Voltar</a>
        <img src="{% static 'css/JulianaBassan/novalogo.jpg' %}" alt="Logo do FoodLink" width="80">
    </div>

    <h2>Seus favoritos!</h2>
    <h4 class="descricao">Seus lugares favoritos, sempre por perto.</h4>

    <div class="centralizacao">
        <div class="lista">
            {% for favorito in favoritos %}
                <div class="favorito">
                    <h3>{{ favorito.restaurante.nome }}</h3>
                    <p>{{ favorito.restaurante.cozinha }}</p>
                </div>
            {% empty %}
                <p>Você ainda não tem restaurantes favoritos.</p>
            {% endfor %}

        </div>
    </div>

    <p class="rodape-fixo">Food<span class="destaque">Link</span></p>
</body>
</html>
